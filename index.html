<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Baccarat Pro AI Adaptive Rotation</title>
    <style>
        :root {
            --bg: #0a0a14;
            --gold: #ffd700;
            --player: #4488ff;
            --banker: #ff4444;
            --tie: #44cc44;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ddd;
            min-height: 100vh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex; justify-content: center; align-items: flex-start; padding: 15px;
        }
        .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
        .header { text-align: center; }
        .header h1 { font-size: 24px; color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,0.3); }
        .domain { font-size: 10px; color: #0ff; background: #2a2a4a; padding: 2px 10px; border-radius: 12px; display: inline-block; margin-top: 4px; }
        .predict-card { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 16px; text-align: center; }
        .predict-label { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
        .predict-value { font-size: 34px; font-weight: 900; margin: 6px 0; }
        .confidence { font-size: 12px; color: #aaa; }
        .confidence span { color: var(--gold); font-weight: bold; }
        .consensus-text { font-size: 10px; color: #888; }
        .badge-row {
            display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 4px;
        }
        .complexity-badge, .rotation-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px;
            background: #222; color: #aaa;
        }
        .buttons { display: flex; gap: 8px; }
        .btn-result {
            flex: 1; padding: 14px 0; border-radius: 10px; border: 2px solid #555;
            background: rgba(255,255,255,0.04); color: #fff; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-player { border-color: var(--player); color: var(--player); background: rgba(68,136,255,0.1); }
        .btn-player:active { background: rgba(68,136,255,0.25); }
        .btn-banker { border-color: var(--banker); color: var(--banker); background: rgba(255,68,68,0.1); }
        .btn-banker:active { background: rgba(255,68,68,0.25); }
        .btn-tie { border-color: var(--tie); color: var(--tie); background: rgba(68,204,68,0.1); }
        .btn-tie:active { background: rgba(68,204,68,0.2); }
        .stats { display: flex; justify-content: space-around; font-size: 12px; color: #aaa; }
        .stats b { font-size: 16px; }
        .section-title { font-size: 11px; color: var(--gold); margin-bottom: 4px; font-weight: bold; }
        .history { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; max-height: 18vh; overflow-y: auto; }
        .history-list { font-family: 'Courier New', monospace; font-size: 10px; line-height: 1.5; white-space: pre-wrap; color: #ccc; }
        .summary-box { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; display: flex; justify-content: space-around; text-align: center; font-size: 13px; }
        .summary-item { display: flex; flex-direction: column; }
        .summary-number { font-size: 20px; font-weight: bold; }
        .actions { display: flex; gap: 6px; }
        .btn-action {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #555;
            background: rgba(255,255,255,0.04); color: #ccc; font-weight: bold; font-size: 12px; cursor: pointer;
        }
        .btn-undo { border-color: #ffaa00; color: #ffaa00; }
        .btn-undo:active { background: rgba(255,170,0,0.2); }
        .btn-clear { border-color: #ff4444; color: #ff4444; }
        .btn-clear:active { background: rgba(255,68,68,0.2); }
        .btn-reset { border-color: #0ff; color: #0ff; }
        .btn-reset:active { background: rgba(0,255,255,0.2); }
        .algo-section { background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px; }
        .algo-title { font-weight: bold; color: var(--gold); font-size: 12px; margin-bottom: 6px; }
        .algo-badges { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 8px; }
        .badge {
            display: inline-block; padding: 3px 7px; border-radius: 8px; font-size: 9px;
            background: #222; border: 1px solid #444; color: #aaa;
        }
        .badge.win { background: #2a2a1a; border-color: var(--gold); color: var(--gold); }
        .final-prediction {
            font-size: 18px; text-align: center; font-weight: bold; padding: 8px;
            background: rgba(255,255,255,0.03); border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🎲 BACCARAT AI LUÂN PHIÊN</h1>
        <span class="domain" id="domainDisplay">--</span>
    </div>

    <div class="predict-card">
        <div class="predict-label">🔮 DỰ ĐOÁN TIẾP THEO</div>
        <div class="predict-value" id="prediction">--</div>
        <div class="confidence">Độ tin cậy: <span id="confidence">--</span></div>
        <div class="consensus-text" id="consensus"></div>
        <div class="badge-row">
            <span class="complexity-badge" id="complexityBadge">Cầu: --</span>
            <span class="rotation-badge" id="rotationBadge">Luân phiên: --</span>
        </div>
    </div>

    <div class="buttons">
        <button class="btn-result btn-player" data-result="Player">🔵 PLAYER</button>
        <button class="btn-result btn-banker" data-result="Banker">🔴 BANKER</button>
        <button class="btn-result btn-tie" data-result="Tie">🟢 TIE</button>
    </div>

    <div class="stats">
        <span>🔵 <b id="playerCount">0</b> Player</span>
        <span>🔴 <b id="bankerCount">0</b> Banker</span>
        <span>🟢 <b id="tieCount">0</b> Tie</span>
        <span>Σ <b id="totalCount">0</b></span>
    </div>

    <div class="section-title">📜 LỊCH SỬ GẦN ĐÂY (đúng/sai)</div>
    <div class="history"><div class="history-list" id="historyList">(Trống)</div></div>

    <div class="section-title">📊 TỔNG HỢP DỰ ĐOÁN</div>
    <div class="summary-box">
        <div class="summary-item"><span>✅ Đúng</span><span class="summary-number" id="correctCount" style="color:#4caf50;">0</span></div>
        <div class="summary-item"><span>❌ Sai</span><span class="summary-number" id="incorrectCount" style="color:#f44336;">0</span></div>
        <div class="summary-item"><span>📈 Tỉ lệ đúng</span><span class="summary-number" id="accuracyRate" style="color:#ffd700;">--</span></div>
    </div>

    <div class="actions">
        <button class="btn-action btn-undo" id="undoBtn">↩ HOÀN TÁC</button>
        <button class="btn-action btn-clear" id="clearBtn">🗑 XÓA TẤT CẢ</button>
        <button class="btn-action btn-reset" id="resetStatsBtn">🔄 RESET THỐNG KÊ</button>
    </div>

    <div class="algo-section">
        <div class="algo-title">🧠 THUẬT TOÁN ĐANG HOẠT ĐỘNG</div>
        <div class="algo-badges" id="algoBadges"></div>
        <div class="final-prediction" id="finalPrediction">--</div>
    </div>
</div>

<script>
(function() {
    const $ = (id) => document.getElementById(id);
    const domainEl = $('domainDisplay');
    const predictionEl = $('prediction');
    const confidenceEl = $('confidence');
    const consensusEl = $('consensus');
    const complexityBadge = $('complexityBadge');
    const rotationBadge = $('rotationBadge');
    const playerCountEl = $('playerCount');
    const bankerCountEl = $('bankerCount');
    const tieCountEl = $('tieCount');
    const totalCountEl = $('totalCount');
    const historyListEl = $('historyList');
    const correctCountEl = $('correctCount');
    const incorrectCountEl = $('incorrectCount');
    const accuracyRateEl = $('accuracyRate');
    const algoBadgesEl = $('algoBadges');
    const finalPredictionEl = $('finalPrediction');
    const undoBtn = $('undoBtn');
    const clearBtn = $('clearBtn');
    const resetStatsBtn = $('resetStatsBtn');

    const MAX_HISTORY = 500;
    const HISTORY_KEY = 'bac_rotation_history';
    const STATS_KEY = 'bac_rotation_stats';
    const ROTATION_KEY = 'bac_rotation_state';

    let history = [];
    let algoStats = {}; // { algo: { correct, total, score } }
    // rotationState: lưu hiệu suất theo chế độ cầu và thuật toán
    let rotationState = {}; // { mode: { algo: { correct, total, weight } } }

    const DEFAULT_ALGOS = ['Bệt', '1-1', '2-2', 'Xu hướng', 'Markov2', 'Đảo chiều', 'Monte Carlo', 'KNN', 'Pattern'];
    const MODES = ['easy', 'medium', 'hard'];

    function initData() {
        DEFAULT_ALGOS.forEach(algo => {
            if (!algoStats[algo]) algoStats[algo] = { correct: 0, total: 0, score: 50 };
        });
        MODES.forEach(mode => {
            if (!rotationState[mode]) rotationState[mode] = {};
            DEFAULT_ALGOS.forEach(algo => {
                if (!rotationState[mode][algo]) {
                    rotationState[mode][algo] = { correct: 0, total: 0, weight: 1.0 };
                }
            });
        });
    }

    try { const saved = localStorage.getItem(HISTORY_KEY); if (saved) history = JSON.parse(saved); } catch (e) {}
    try {
        const savedStats = localStorage.getItem(STATS_KEY);
        if (savedStats) { const parsed = JSON.parse(savedStats); DEFAULT_ALGOS.forEach(algo => { if (parsed[algo]) algoStats[algo] = parsed[algo]; }); }
    } catch (e) {}
    try {
        const savedRotation = localStorage.getItem(ROTATION_KEY);
        if (savedRotation) { const parsed = JSON.parse(savedRotation); MODES.forEach(mode => { if (parsed[mode]) rotationState[mode] = parsed[mode]; }); }
    } catch (e) {}
    initData();

    domainEl.textContent = window.location.hostname || 'Công cụ Baccarat';

    function saveHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    function saveStats() { localStorage.setItem(STATS_KEY, JSON.stringify(algoStats)); }
    function saveRotation() { localStorage.setItem(ROTATION_KEY, JSON.stringify(rotationState)); }

    function updateAlgoStatsAndRotation(actualResult) {
        const cached = sessionStorage.getItem('bac_rotation_preds');
        if (!cached) return;
        const predictions = JSON.parse(cached);
        const currentMode = getCurrentMode();
        predictions.forEach(p => {
            if (p.algo && algoStats[p.algo]) {
                algoStats[p.algo].total++;
                if (p.bet === actualResult) {
                    algoStats[p.algo].correct++;
                    algoStats[p.algo].score = Math.min(100, algoStats[p.algo].score + 5);
                } else {
                    algoStats[p.algo].score = Math.max(10, algoStats[p.algo].score - 12);
                }
                // Cập nhật rotation state
                if (rotationState[currentMode] && rotationState[currentMode][p.algo]) {
                    rotationState[currentMode][p.algo].total++;
                    if (p.bet === actualResult) {
                        rotationState[currentMode][p.algo].correct++;
                        // Tăng trọng số nếu đúng (tối đa 5.0)
                        rotationState[currentMode][p.algo].weight = Math.min(5.0, rotationState[currentMode][p.algo].weight + 0.3);
                    } else {
                        // Giảm trọng số nếu sai (tối thiểu 0.2)
                        rotationState[currentMode][p.algo].weight = Math.max(0.2, rotationState[currentMode][p.algo].weight - 0.4);
                    }
                }
            }
        });
        saveStats();
        saveRotation();
        sessionStorage.removeItem('bac_rotation_preds');
    }

    function addResult(result) {
        const wasCorrect = (lastPredictedBet !== null) ? (result === lastPredictedBet) : null;
        if (lastPredictedBet !== null) updateAlgoStatsAndRotation(result);
        history.push({ result, time: new Date().toLocaleTimeString(), correct: wasCorrect });
        if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
        saveHistory();
        lastPredictedBet = null;
        render();
    }

    function undo() { if (history.length === 0) return; history.pop(); saveHistory(); render(); }
    function clearAll() { if (confirm('Xóa toàn bộ lịch sử?')) { history = []; saveHistory(); render(); } }
    function resetStats() {
        if (confirm('Reset toàn bộ thống kê và luân phiên?')) {
            DEFAULT_ALGOS.forEach(algo => { algoStats[algo] = { correct: 0, total: 0, score: 50 }; });
            MODES.forEach(mode => {
                rotationState[mode] = {};
                DEFAULT_ALGOS.forEach(algo => { rotationState[mode][algo] = { correct: 0, total: 0, weight: 1.0 }; });
            });
            saveStats(); saveRotation(); render();
        }
    }

    document.querySelectorAll('.btn-result').forEach(btn => {
        btn.addEventListener('click', () => addResult(btn.getAttribute('data-result')));
    });
    undoBtn.addEventListener('click', undo);
    clearBtn.addEventListener('click', clearAll);
    resetStatsBtn.addEventListener('click', resetStats);

    function getResultsArray() { return history.map(h => h.result); }

    function calculateEntropy(arr, windowSize = 20) {
        const recent = arr.slice(-windowSize).filter(r => r === 'Player' || r === 'Banker');
        if (recent.length < 4) return 0.5;
        const freq = {};
        recent.forEach(r => freq[r] = (freq[r] || 0) + 1);
        const total = recent.length;
        let entropy = 0;
        for (const key in freq) {
            const p = freq[key] / total;
            entropy -= p * Math.log2(p);
        }
        return entropy;
    }

    function getCurrentMode() {
        const arr = getResultsArray();
        const entropy = calculateEntropy(arr);
        if (entropy < 0.4) return 'easy';
        if (entropy < 0.65) return 'medium';
        return 'hard';
    }

    function detectSimplePattern(arr) {
        if (arr.length < 4) return null;
        const last4 = arr.slice(-4);
        const isAlt = last4.every((r, i) => i === 0 || r !== last4[i - 1]);
        if (isAlt) return { type: '1-1', next: last4[3] === 'Player' ? 'Banker' : 'Player', confidence: 85 };
        if (arr.length >= 8) {
            const last8 = arr.slice(-8).map(r => r[0]).join('');
            if (last8 === 'PPBBPPBB') return { type: '2-2', next: 'Player', confidence: 90 };
            if (last8 === 'BBPPBBPP') return { type: '2-2', next: 'Banker', confidence: 90 };
        }
        const last = arr[arr.length - 1];
        let streak = 1;
        for (let i = arr.length - 2; i >= 0; i--) { if (arr[i] === last) streak++; else break; }
        if (streak >= 3 && last !== 'Tie') return { type: 'Bệt', next: last, confidence: 75 + streak * 3 };
        return null;
    }

    // --- THUẬT TOÁN ---
    function predictStreak() { /* ... giữ nguyên ... */ const arr = getResultsArray(); if (arr.length < 2) return null; const last = arr[arr.length-1]; let streak = 1; for (let i=arr.length-2; i>=0; i--) { if (arr[i]===last) streak++; else break; } if (streak>=2 && last!=='Tie') { const breakProb = Math.min(0.2 + streak*0.07, 0.8); const bet = Math.random() < breakProb ? (last==='Banker'?'Player':'Banker') : last; return { algo:'Bệt', bet, confidence: Math.round((1-breakProb)*100) }; } return null; }
    function predictAlternating() { const arr = getResultsArray(); if (arr.length < 4) return null; const last4 = arr.slice(-4); const isAlt = last4.every((r,i) => i===0 || r!==last4[i-1]); if (isAlt) return { algo:'1-1', bet: last4[3]==='Player'?'Banker':'Player', confidence: 75 }; return null; }
    function predictTwoTwo() { const arr = getResultsArray(); if (arr.length < 8) return null; const last8 = arr.slice(-8).map(r=>r[0]).join(''); if (last8==='PPBBPPBB') return { algo:'2-2', bet:'Player', confidence:88 }; if (last8==='BBPPBBPP') return { algo:'2-2', bet:'Banker', confidence:88 }; return null; }
    function predictTrend() { const arr = getResultsArray(); if (arr.length < 15) return null; let wB=0,wP=0; arr.slice(-30).forEach((r,i)=>{ const w=Math.pow(1.08,i); if (r==='Banker') wB+=w; else if (r==='Player') wP+=w; }); const total=wB+wP; if (total<40) return null; const bRate=wB/total; if (bRate>0.53) return { algo:'Xu hướng', bet:'Banker', confidence:Math.round(bRate*100) }; if (bRate<0.47) return { algo:'Xu hướng', bet:'Player', confidence:Math.round((1-bRate)*100) }; return null; }
    function predictMarkov2() { const arr = getResultsArray(); if (arr.length<5) return null; const lastTwo=arr.slice(-2).join(','); const trans={}; for (let i=2;i<arr.length;i++){ const state=arr.slice(i-2,i).join(','); const next=arr[i]; if(!trans[state]) trans[state]={}; trans[state][next]=(trans[state][next]||0)+1; } const counts=trans[lastTwo]||{}; const total=Object.values(counts).reduce((a,b)=>a+b,0); if(total<2) return null; let best='Banker',bestCnt=counts.Banker||0; if((counts.Player||0)>bestCnt){best='Player';bestCnt=counts.Player;} if((counts.Tie||0)>bestCnt){best='Tie';bestCnt=counts.Tie;} return { algo:'Markov2', bet:best, confidence:Math.round((bestCnt/total)*100) }; }
    function predictReversal() { const arr = getResultsArray(); if(arr.length<5) return null; const last=arr[arr.length-1]; let streak=1; for(let i=arr.length-2;i>=0;i--){if(arr[i]===last)streak++;else break;} if(streak>=4 && last!=='Tie'){ const next=last==='Banker'?'Player':'Banker'; return { algo:'Đảo chiều', bet:next, confidence:Math.min(60+streak*5,85) }; } return null; }
    function predictMonteCarlo() { const arr = getResultsArray(); if(arr.length<10) return null; let cntB=0,cntP=0,cntT=0; arr.forEach(r=>{if(r==='Banker')cntB++;else if(r==='Player')cntP++;else cntT++;}); const total=arr.length; const pB=cntB/total,pP=cntP/total; let simB=0,simP=0; for(let i=0;i<5000;i++){const r=Math.random();if(r<pB)simB++;else if(r<pB+pP)simP++;} if(simB>simP)return {algo:'Monte Carlo',bet:'Banker',confidence:Math.round((simB/5000)*100)}; else if(simP>simB)return {algo:'Monte Carlo',bet:'Player',confidence:Math.round((simP/5000)*100)}; return null; }
    function predictKNN() { const arr = getResultsArray(); if(arr.length<6) return null; const len=4; const lastPattern=arr.slice(-len); const candidates=[]; for(let i=0;i<=arr.length-len-1;i++){let dist=0;for(let j=0;j<len;j++)if(arr[i+j]!==lastPattern[j])dist++;if(i+len<arr.length)candidates.push({dist,next:arr[i+len]});} if(candidates.length===0)return null; candidates.sort((a,b)=>a.dist-b.dist); const k=Math.min(5,candidates.length); const topK=candidates.slice(0,k); const freq={}; topK.forEach(c=>{freq[c.next]=(freq[c.next]||0)+1;}); let best='Banker',bestCnt=0; for(const[key,cnt]of Object.entries(freq))if(cnt>bestCnt){best=key;bestCnt=cnt;} return {algo:'KNN',bet:best,confidence:Math.round((bestCnt/k)*100)}; }
    function predictPattern() { const arr = getResultsArray(); if(arr.length<8)return null; for(let len=5;len>=3;len--){if(arr.length<len*2)continue; const lastSeq=arr.slice(-len).join(','); for(let i=0;i<=arr.length-len-1;i++){if(arr.slice(i,i+len).join(',')===lastSeq && i+len<arr.length){return {algo:'Pattern',bet:arr[i+len],confidence:70+len*5};}}} return null; }

    const algoFunctions = {
        'Bệt': predictStreak,
        '1-1': predictAlternating,
        '2-2': predictTwoTwo,
        'Xu hướng': predictTrend,
        'Markov2': predictMarkov2,
        'Đảo chiều': predictReversal,
        'Monte Carlo': predictMonteCarlo,
        'KNN': predictKNN,
        'Pattern': predictPattern
    };

    function getAllPredictions(mode, simplePattern) {
        let selectedAlgos = [];
        if (mode === 'easy') {
            // Cầu dễ: ưu tiên các thuật toán đơn giản, nhưng vẫn thử 1-2 thuật toán phức tạp với xác suất thấp
            selectedAlgos = ['Bệt', '1-1', '2-2'];
            if (Math.random() < 0.2) selectedAlgos.push('Xu hướng');
            if (Math.random() < 0.2) selectedAlgos.push('Markov2');
        } else if (mode === 'medium') {
            // Cầu trung bình: dùng tất cả thuật toán, nhưng giảm trọng số đơn giản nếu chúng hoạt động kém
            selectedAlgos = [...DEFAULT_ALGOS];
        } else {
            // Cầu khó: ưu tiên thuật toán phức tạp, thỉnh thoảng thử đơn giản
            selectedAlgos = ['Markov2', 'Monte Carlo', 'KNN', 'Pattern', 'Xu hướng', 'Đảo chiều'];
            if (Math.random() < 0.15) selectedAlgos.push('Bệt');
            if (Math.random() < 0.15) selectedAlgos.push('1-1');
            if (Math.random() < 0.15) selectedAlgos.push('2-2');
        }

        const preds = [];
        selectedAlgos.forEach(algo => {
            if (algoFunctions[algo]) {
                const prediction = algoFunctions[algo]();
                if (prediction) preds.push(prediction);
            }
        });
        // Lưu lại để cập nhật khi có kết quả
        sessionStorage.setItem('bac_rotation_preds', JSON.stringify(preds));
        return preds;
    }

    function ensemble(predictions, mode) {
        if (!predictions.length) return { bet: null, confidence: 0, consensus: '' };
        const votes = {};
        let totalWeight = 0;
        predictions.forEach(p => {
            // Lấy trọng số từ rotation state cho mode hiện tại
            const rot = rotationState[mode] && rotationState[mode][p.algo] ? rotationState[mode][p.algo].weight : 1.0;
            const stats = algoStats[p.algo] || { correct: 0, total: 0, score: 50 };
            const accuracy = (stats.correct + 1) / (stats.total + 2);
            // Trọng số tổng hợp: rotation weight * accuracy * score/100
            const weight = rot * (0.4 + 0.6 * accuracy) * (stats.score / 100);
            if (!votes[p.bet]) votes[p.bet] = { weight: 0, algos: [] };
            votes[p.bet].weight += weight;
            votes[p.bet].algos.push(p.algo);
            totalWeight += weight;
        });
        let bestBet = null, bestWeight = 0;
        for (const [bet, data] of Object.entries(votes)) {
            if (data.weight > bestWeight) { bestBet = bet; bestWeight = data.weight; }
        }
        const finalConf = totalWeight > 0 ? Math.round((bestWeight / totalWeight) * 100) : 0;
        const algoNames = votes[bestBet] ? votes[bestBet].algos.join(', ') : '';
        return { bet: bestBet, confidence: finalConf, consensus: `${algoNames} đồng thuận` };
    }

    function render() {
        const arr = getResultsArray();
        const entropy = calculateEntropy(arr);
        const mode = getCurrentMode();
        const simple = detectSimplePattern(arr);

        // Cập nhật badge
        let modeText = '';
        if (mode === 'easy') { modeText = 'Dễ (ổn định)'; complexityBadge.style.color = '#4caf50'; }
        else if (mode === 'medium') { modeText = 'Trung bình'; complexityBadge.style.color = '#ff9800'; }
        else { modeText = 'Khó (hỗn loạn)'; complexityBadge.style.color = '#f44336'; }
        complexityBadge.textContent = `Cầu: ${modeText}`;

        // Rotation badge hiển thị số thuật toán đang dùng và mode
        const preds = getAllPredictions(mode, simple);
        const final = ensemble(preds, mode);
        lastPredictedBet = final.bet;

        const rotationInfo = mode === 'easy' ? 'Ưu tiên đơn giản' : (mode === 'medium' ? 'Tất cả thuật toán' : 'Ưu tiên phức tạp');
        rotationBadge.textContent = `Luân phiên: ${rotationInfo}`;

        // Cập nhật UI
        const stats = { Banker: 0, Player: 0, Tie: 0 };
        history.forEach(h => stats[h.result]++);
        playerCountEl.textContent = stats.Player;
        bankerCountEl.textContent = stats.Banker;
        tieCountEl.textContent = stats.Tie;
        totalCountEl.textContent = history.length;

        if (history.length === 0) historyListEl.textContent = '(Trống)';
        else {
            const recent = history.slice(-20).reverse();
            let text = '';
            recent.forEach(item => {
                const icon = item.result === 'Banker' ? '🔴' : (item.result === 'Player' ? '🔵' : '🟢');
                text += `${icon} ${item.result.padEnd(8)} ${item.time}${item.correct===true?' ✅':item.correct===false?' ❌':''}\n`;
            });
            historyListEl.textContent = text;
        }

        let correctTotal = 0, incorrectTotal = 0;
        history.forEach(item => { if (item.correct===true) correctTotal++; else if (item.correct===false) incorrectTotal++; });
        correctCountEl.textContent = correctTotal;
        incorrectCountEl.textContent = incorrectTotal;
        const totalPreds = correctTotal + incorrectTotal;
        accuracyRateEl.textContent = totalPreds > 0 ? Math.round((correctTotal / totalPreds) * 100) + '%' : '--';

        if (final.bet) {
            const icon = final.bet === 'Banker' ? '🔴' : (final.bet === 'Player' ? '🔵' : '🟢');
            predictionEl.innerHTML = `${icon} ${final.bet}`;
            confidenceEl.textContent = final.confidence + '%';
            consensusEl.textContent = final.consensus;
        } else {
            predictionEl.innerHTML = '--';
            confidenceEl.textContent = 'Cần thêm dữ liệu';
            consensusEl.textContent = '';
        }

        algoBadgesEl.innerHTML = preds.map(p => {
            const voted = p.bet === final.bet;
            const stats = algoStats[p.algo] || { correct: 0, total: 0, score: 50 };
            const accuracy = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : '--';
            const rotWeight = rotationState[mode] && rotationState[mode][p.algo] ? rotationState[mode][p.algo].weight.toFixed(2) : '1.0';
            const cls = voted ? 'badge win' : 'badge';
            return `<span class="${cls}" title="Điểm: ${stats.score} | Đúng: ${stats.correct}/${stats.total} (${accuracy}%) | Trọng số mode: ${rotWeight}">${p.algo}: ${p.bet} (${p.confidence}%)</span>`;
        }).join('');

        const icon = final.bet === 'Banker' ? '🔴' : (final.bet === 'Player' ? '🔵' : '🟢');
        finalPredictionEl.innerHTML = `${icon} <b>${final.bet || '--'}</b> (${final.confidence || 0}%)`;
    }

    render();
})();
</script>
</body>
</html>
